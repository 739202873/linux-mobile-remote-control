name: Build and Release Mobile-RC Rust Daemon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin_name: mobile-rc
            asset: mobile-rc-linux-x86_64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            bin_name: mobile-rc
            asset: mobile-rc-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: mobile-rc.exe
            asset: mobile-rc-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: daemon-rs
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux cross/static build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon-rs/target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('daemon-rs/Cargo.lock') }}

      - name: Run unit tests (host target)
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: cargo test --locked

      - name: Build release binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p ../dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "../dist/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum mobile-rc-* > SHA256SUMS.txt

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mobile-rc-*
            dist/SHA256SUMS.txt
