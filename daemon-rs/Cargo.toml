[package]
name = "mobile-rc"
version = "3.0.0"
edition = "2021"
description = "Mobile-RC cross-platform Rust daemon (Linux & Windows)"

[[bin]]
name = "mobile-rc"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["http1", "json", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
subtle = "2.5"
futures-util = { version = "0.3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
